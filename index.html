<style>
:root{--navy:#0b1533;--navy2:#132250;--o:#f4511e;--a:#f59e0b;--t:#0ea5a4;--b:#1d4ed8;--p:#7c3aed;
--grad:linear-gradient(135deg,#f4511e,#f59e0b 32%,#1d4ed8 68%,#7c3aed);
--bg:#f2f4fa;--card:#fff;--line:#e4e8f2;--tx:#0b1533;--mu:#66728f;--ok:#10b981;--er:#ef4444;--r:16px;
--sh:0 1px 2px rgba(11,21,51,.05),0 8px 24px rgba(11,21,51,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.mont{font-family:Montserrat,Inter,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--tx);outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(29,78,216,.1)}
textarea{min-height:84px;resize:vertical}
.side{position:fixed;inset:0 auto 0 0;width:268px;background:linear-gradient(180deg,var(--navy),#0a1230);color:#fff;display:flex;flex-direction:column;z-index:50;transition:transform .3s}
.side::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--grad)}
.logo{margin:22px 16px 8px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.logo img{width:100%;height:auto;max-height:64px;object-fit:contain}
.logo .fb{display:none;font:800 15px Montserrat;background:var(--grad);-webkit-background-clip:text;color:transparent;text-align:center}
.nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav small{display:block;font:700 10px Montserrat;letter-spacing:1.4px;color:rgba(255,255,255,.35);padding:10px 12px 6px}
.nv{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:rgba(255,255,255,.7);font-weight:600;margin-bottom:4px;text-align:left;transition:.15s}
.nv:hover{background:rgba(255,255,255,.07);color:#fff}
.nv.on{background:linear-gradient(135deg,rgba(244,81,30,.25),rgba(124,58,237,.25));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.nv b{margin-left:auto;background:var(--a);color:var(--navy);font-size:11px;padding:1px 8px;border-radius:99px}
.sf{padding:16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.6)}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .4s}
.main{margin-left:268px;min-height:100vh}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 28px;background:rgba(242,244,250,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.3px;flex:1}
.top input{max-width:260px;padding:9px 13px}
.burger{display:none;width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;font-size:18px}
.pill{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:8px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.pill.ok i{background:var(--ok)}.pill.dirty i{background:var(--a);animation:pl 1s infinite}.pill.err i{background:var(--er)}.pill.sync i{background:var(--b);animation:pl .6s infinite}
@keyframes pl{50%{opacity:.3}}
.pg{padding:26px 28px 60px;max-width:1240px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:11px;font-weight:700;font-size:13px;border:1.5px solid var(--line);background:#fff;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn.pri{background:var(--grad);color:#fff;border:0;box-shadow:0 6px 18px rgba(124,58,237,.3)}
.btn.dk{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.dn{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.btn:disabled{opacity:.5;cursor:wait;transform:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.stat{padding:20px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.12}
.stat small{color:var(--mu);font-weight:600}.stat h2{font-size:32px;font-weight:800;margin-top:4px}
.tc{overflow:hidden;cursor:pointer;transition:.2s}
.tc:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(11,21,51,.12)}
.tc-h{display:flex;gap:12px;padding:16px;align-items:flex-start;border-bottom:1px solid var(--line)}
.tc-av{width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font:800 20px Montserrat;flex:none;overflow:hidden}
.tc-av img{width:100%;height:100%;object-fit:cover}
.tc-meta{flex:1;min-width:0}
.tc-name{font-weight:700;font-size:15px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-co{font-size:12px;color:var(--mu);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-stars{color:var(--a);font-size:15px;letter-spacing:1px}
.tc-status{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.tc-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
.badge-verified{background:#dcfce7;color:#166534}
.badge-featured{background:#fef3c7;color:#92400e}
.badge-pending{background:#fee2e2;color:#991b1b}
.badge-new{background:#dbeafe;color:#1e40af}
.tc-body{padding:12px 16px 16px}
.tc-title{font-weight:700;font-size:14px;margin-bottom:6px;line-height:1.35}
.tc-text{font-size:12.5px;color:#475569;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tc-when{font-size:11px;color:var(--mu);text-align:right;margin-top:8px}
.sec{padding:22px;margin-bottom:18px}
.sec h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.sec h3 span{width:24px;height:24px;border-radius:8px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:12px}
.fg{margin-bottom:14px}.fg>label{display:block;font-weight:600;font-size:12px;margin-bottom:6px;color:#334066}
.g2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.cc{text-align:right;font-size:11px;color:var(--mu);margin-top:4px}.cc.x{color:var(--er)}
.stars{display:flex;gap:6px;font-size:34px;line-height:1;user-select:none}
.stars span{color:#d1d5db;cursor:pointer;transition:.15s;border-radius:4px}
.stars span:hover,.stars span.on{color:var(--a);transform:scale(1.1)}
.stars span:focus-visible{outline:2px solid var(--b);outline-offset:3px;transform:scale(1.1)}
.rating-label{font-size:12px;color:var(--mu);margin-top:6px;font-weight:600}
.up{position:relative;border:2px dashed #c7d0e6;border-radius:14px;padding:22px;text-align:center;background:#fafbff;color:var(--mu);transition:.15s;cursor:pointer}
.up:hover,.up.dr{border-color:var(--p);background:#f6f2ff;transform:scale(1.005)}
.up.dr{border-style:solid;box-shadow:0 0 0 4px rgba(124,58,237,.12)}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0}
.up-ico{font-size:26px;margin-bottom:6px}
.up-sub{font-size:11px;color:var(--mu);margin-top:4px}
/* --- new: customer photo upload --- */
.photo-box{position:relative;border:2px dashed #c7d0e6;border-radius:14px;padding:20px 18px;background:#fafbff;transition:.15s;text-align:center;color:var(--mu)}
.photo-box.dr{border-color:var(--p);background:#f6f2ff;border-style:solid;box-shadow:0 0 0 4px rgba(124,58,237,.12);transform:scale(1.005)}
.photo-box.has-photo{padding:14px;background:#fff;border-style:solid;border-color:#d1d5db}
.photo-drop{cursor:pointer;user-select:none}
.photo-drop .up-ico{font-size:30px;margin-bottom:4px}
.photo-drop b{display:block;font-size:13px;color:var(--tx);margin-bottom:3px;font-weight:700}
.photo-drop small{font-size:11.5px;color:var(--mu);line-height:1.5;display:block}
.photo-drop small.kbd{display:inline-block;background:#eef1f8;border:1px solid #d6dbe8;border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#475569;margin:0 2px}
.photo-input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-preview{display:flex;align-items:center;gap:14px;text-align:left}
.photo-thumb{width:80px;height:80px;border-radius:12px;overflow:hidden;background:var(--navy);flex:none;box-shadow:0 4px 12px rgba(11,21,51,.15)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-info{flex:1;min-width:0}
.photo-info b{display:block;font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.photo-info small{font-size:11px;color:var(--mu)}
.photo-info .ok{color:#059669;font-weight:700}
.photo-actions{display:flex;flex-direction:column;gap:6px;flex:none}
.photo-actions button{padding:6px 12px;border-radius:8px;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);background:#fff}
.photo-actions button:hover{border-color:var(--b);color:var(--b)}
.photo-actions button.rm{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
.photo-hint{font-size:11.5px;color:var(--mu);margin-top:10px;line-height:1.55;text-align:center}
.photo-hint a{color:var(--b);text-decoration:underline}
.thanks-photo{width:96px;height:96px;border-radius:50%;overflow:hidden;margin:0 auto 16px;border:4px solid #fff;box-shadow:0 8px 24px rgba(11,21,51,.15)}
.thanks-photo img{width:100%;height:100%;object-fit:cover;display:block}
/* --- end new --- */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.tb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--navy)}
.tb img{width:100%;height:100%;object-fit:cover}
.tb button{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(11,21,51,.85);color:#fff}
.tg-row{display:flex;gap:14px;flex-wrap:wrap}
.tg-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fafbff;cursor:pointer;transition:.15s;flex:1;min-width:180px}
.tg-item:hover{border-color:var(--b);background:#f5f7ff}
.tg-item.on{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7}
.tg-item.on.gold{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fcd34d}
.tg-item input{display:none}
.tg-check{width:20px;height:20px;border:2px solid var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;color:#fff;transition:.15s}
.tg-item.on .tg-check{background:var(--ok);border-color:var(--ok)}
.tg-item.on.gold .tg-check{background:var(--a);border-color:var(--a)}
.tg-text{font-size:13px;font-weight:600;line-height:1.3}
.tg-text small{display:block;font-weight:400;font-size:11px;color:var(--mu);margin-top:2px}
.edtop{position:sticky;top:64px;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:18px}
.edtop h2{flex:1;font-size:16px;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:70px 20px;color:var(--mu)}.empty div{font-size:52px;margin-bottom:10px}
.alert{padding:12px 16px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12.5px;margin-bottom:16px;line-height:1.55}
.alert.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.alert.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.privacy{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:14px;margin-top:14px;font-size:12.5px;color:#1e40af;line-height:1.6}
.privacy b{font-weight:800}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,rgba(244,81,30,.08),transparent 40%),radial-gradient(circle at 80% 90%,rgba(124,58,237,.08),transparent 40%),var(--bg)}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:32px 28px;box-shadow:0 20px 60px rgba(11,21,51,.12),0 4px 12px rgba(11,21,51,.05);border:1px solid var(--line);position:relative;overflow:hidden}
.login-card::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--grad)}
.login-logo{text-align:center;margin-bottom:22px}
.login-logo img{max-height:60px;margin:0 auto 10px;display:block}
.login-logo .fb{font:800 18px Montserrat;background:var(--grad);-webkit-background-clip:text;color:transparent}
.login-logo h2{font-size:20px;font-weight:800;margin-top:10px;color:var(--tx)}
.login-logo p{color:var(--mu);font-size:13px;margin-top:4px}
.login-card .fg{margin-bottom:16px}
.login-card .btn{width:100%;justify-content:center;padding:13px;font-size:14px}
.login-err{background:#fef2f2;color:#991b1b;padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:14px;text-align:center;border:1px solid #fecaca}
.login-hint{text-align:center;font-size:11.5px;color:var(--mu);margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.cust-wrap{min-height:100vh;padding:24px 16px 60px;background:radial-gradient(circle at 10% 0%,rgba(244,81,30,.06),transparent 40%),radial-gradient(circle at 90% 100%,rgba(29,78,216,.06),transparent 40%),var(--bg)}
.cust-container{max-width:560px;margin:0 auto}
.cust-header{text-align:center;padding:24px 16px 26px;margin-bottom:24px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(11,21,51,.08);position:relative;overflow:hidden}
.cust-header::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--grad)}
.cust-header img{max-height:60px;margin:0 auto 10px;display:block}
.cust-header .fb{font:800 18px Montserrat;background:var(--grad);-webkit-background-clip:text;color:transparent}
.cust-header h1{font-size:22px;font-weight:800;margin-top:12px;color:var(--tx)}
.cust-header p{color:var(--mu);font-size:13.5px;margin-top:6px;line-height:1.6}
.cust-card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(11,21,51,.08);border:1px solid var(--line);margin-bottom:16px}
.cust-card h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;color:var(--mu);font-weight:700}
.cust-foot{text-align:center;padding:20px 16px;color:var(--mu);font-size:12px}
.cust-foot b{color:var(--tx);font-weight:700}
.hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important;opacity:0!important;pointer-events:none!important}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--mu);line-height:1.55;cursor:pointer}
.consent input{width:auto;flex:none;margin-top:2px;accent-color:var(--b)}
.consent a{color:var(--b);text-decoration:underline}
.pub-section{max-width:560px;margin:36px auto 0}
.pub-section h2{font-size:18px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.pub-summary{font-size:12.5px;color:var(--mu);margin-bottom:16px;font-weight:600}
.pub-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(11,21,51,.06);border:1px solid var(--line);margin-bottom:12px}
.pub-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.pub-av{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font:800 16px Montserrat;flex:none;overflow:hidden}
.pub-av img{width:100%;height:100%;object-fit:cover}
.pub-meta{flex:1;min-width:0}
.pub-name{font-weight:700;font-size:14px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pub-co{font-size:11.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pub-when{font-size:10.5px;color:var(--mu);white-space:nowrap;font-weight:600}
.pub-stars{color:var(--a);font-size:13px;letter-spacing:.5px;margin-bottom:8px}
.pub-title{font-weight:700;font-size:13.5px;margin-bottom:5px;line-height:1.35}
.pub-text{font-size:12.5px;color:#475569;line-height:1.6;white-space:pre-wrap}
.pub-skel{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;border:1px solid var(--line)}
.pub-skel div{height:11px;background:linear-gradient(90deg,#eef1f7,#e0e5f0,#eef1f7);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:6px;margin-bottom:8px}
.pub-skel div:nth-child(1){width:35%}
.pub-skel div:nth-child(2){width:90%}
.pub-skel div:nth-child(3){width:70%}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.thanks-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 50% 0%,rgba(16,185,129,.08),transparent 50%),radial-gradient(circle at 50% 100%,rgba(29,78,216,.08),transparent 50%),var(--bg)}
.thanks-card{max-width:520px;width:100%;background:#fff;border-radius:24px;padding:48px 32px 36px;text-align:center;box-shadow:0 20px 60px rgba(11,21,51,.12);border:1px solid var(--line);position:relative;overflow:hidden;animation:pop .4s ease}
@keyframes pop{0%{opacity:0;transform:scale(.95) translateY(10px)}100%{opacity:1;transform:none}}
.thanks-card::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,#10b981,#0ea5a4)}
.thanks-icon{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);color:#fff;display:grid;place-items:center;font-size:44px;margin:0 auto 22px;box-shadow:0 12px 30px rgba(16,185,129,.35);animation:checkIn .5s .1s ease both}
@keyframes checkIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.thanks-card h1{font-size:26px;font-weight:800;color:var(--tx);margin-bottom:12px}
.thanks-card p{color:var(--mu);font-size:15px;line-height:1.7;margin-bottom:24px}

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'t_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const RAW=p=>`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${p}`;
const src=i=>i?(i.dataUrl||i.url||''):'';
const cloud=()=>!!(cfg.owner&&cfg.repo&&cfg.token);
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const avgRating=(items)=>{
  const p=(items||S.testimonials).filter(t=>t.publishPermission);
  if(!p.length)return 0;
  return Math.round((p.reduce((s,t)=>s+t.rating,0)/p.length)*10)/10;
};

function ago(iso){
  if(!iso)return '';
  const d=new Date(iso);
  if(isNaN(d))return '';
  const s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<60)return 'just now';
  const m=Math.floor(s/60);if(m<60)return m+'m ago';
  const h=Math.floor(m/60);if(h<24)return h+'h ago';
  const dy=Math.floor(h/24);if(dy<30)return dy+'d ago';
  const mo=Math.floor(dy/30);if(mo<12)return mo+'mo ago';
  return Math.floor(mo/12)+'y ago';
}

function b64enc(str){
  const bytes=new TextEncoder().encode(str);
  let bin='';
  for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b64){
  const bin=atob(String(b64).replace(/\n/g,''));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

let toastT;
function toast(m,t){
  const e=$('#toast');e.textContent=m;e.className='toast show '+(t||'');
  clearTimeout(toastT);toastT=setTimeout(()=>e.className='toast',2800);
}

function hyd(t){
  t.id=t.id||uid();
  t.customerName=t.customerName||'';
  t.companyName=t.companyName||'';
  t.designation=t.designation||'';
  t.location=t.location||'';
  t.machines=t.machines||'';
  t.heardFrom=t.heardFrom||'';
  t.rating=Math.max(1,Math.min(5,+t.rating||5));
  t.reviewTitle=t.reviewTitle||'';
  t.reviewText=t.reviewText||'';
  t.reviewDate=t.reviewDate||new Date().toISOString().slice(0,10);
  t.verified=!!t.verified;
  t.featured=!!t.featured;
  t.publishPermission=!!t.publishPermission;
  t.source=t.source||'admin';
  t.seenByAdmin=!!t.seenByAdmin;
  t.isSample=!!t.isSample;
  t.createdAt=t.createdAt||new Date().toISOString();
  t.photo=t.photo||null;
  return t;
}

/* =========================================================
   LOCAL STORAGE
========================================================= */
function saveLocal(){
  try{
    const j=JSON.stringify(S);
    if(j.length>4.5e6){
      const lite={testimonials:S.testimonials.map(t=>({
        ...t,
        photo:t.photo&&t.photo.url?{...t.photo,dataUrl:null}:null
      }))};
      localStorage.setItem(DB,JSON.stringify(lite));
    }else{
      localStorage.setItem(DB,j);
    }
  }catch(e){console.warn(e)}
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(DB);
    if(raw){
      const p=JSON.parse(raw);
      S.testimonials=(p.testimonials||[]).map(hyd);
    }
  }catch(e){}

/* =========================================================
   AUTOSAVE
========================================================= */
function touch(){
  dirty=true;
  clearTimeout(tL);tL=setTimeout(saveLocal,LOCAL_DELAY);
  pill();
  if(cloud()){clearTimeout(tC);tC=setTimeout(()=>ghSave(false),CLOUD_DELAY)}
}
function pill(state,txt){
  const p=$('#pill');if(!p)return;
  let c='',t;
  const unpublished=S.testimonials.filter(x=>!x.publishPermission).length;
  if(saving){c='sync';t='Saving…'}
  else if(state==='err'){c='err';t=txt||'Save failed'}
  else if(dirty){c='dirty';t=cloud()?'Unsaved · autosave soon':'Saved on this device'}
  else if(!cloud()){t='Saved locally'}
  else{
    c='ok';
    const base=lastSave?'Saved '+lastSave.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Connected';
    t=unpublished?base+' · '+unpublished+' local-only':base;
  }
  p.className='pill '+c;$('#pt').textContent=t;
}

/* =========================================================
   GITHUB
========================================================= */
const H=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});
const API=p=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}`;
async function ghGet(p){
  const r=await fetch(API(p)+'?ref='+cfg.branch,{headers:H(),cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw Error(p+' → HTTP '+r.status);
  return r.json();
}
async function ghPut(p,b64,sha){
  const r=await fetch(API(p),{
    method:'PUT',
    headers:{...H(),'Content-Type':'application/json'},
    body:JSON.stringify({message:'Update '+p,content:b64,branch:cfg.branch,...(sha?{sha}:{})})
  });
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw Error(p+' → HTTP '+r.status+' '+m)}
  return r.json();
}
async function upload(obj,path){
  if(!obj||!obj.dataUrl||obj.up===obj.dataUrl.length)return;
  const ex=await ghGet(path).catch(()=>null);
  await ghPut(path,obj.dataUrl.split(',')[1],ex&&ex.sha);
  obj.url=RAW(path);obj.up=obj.dataUrl.length;
}
function clean(t,inline){
  const f=o=>o&&{filename:o.filename||'',url:o.url||null,...(inline&&o.dataUrl?{dataUrl:o.dataUrl}:{})};
  return {
    id:t.id,
    customerName:t.customerName.trim(),
    companyName:t.companyName.trim(),
    designation:t.designation.trim(),
    location:t.location.trim(),
    photo:f(t.photo),
    machines:t.machines.trim(),
    heardFrom:(t.heardFrom||'').trim(),
    rating:t.rating,
    reviewTitle:t.reviewTitle.trim(),
    reviewText:t.reviewText.trim(),
    reviewDate:t.reviewDate,
    verified:!!t.verified,
    featured:!!t.featured,
    publishPermission:!!t.publishPermission,
    source:t.source,
    seenByAdmin:!!t.seenByAdmin,
    isSample:!!t.isSample,
    createdAt:t.createdAt
  };
}
function payload(inline,publishedOnly){
  let items=S.testimonials;
  if(publishedOnly)items=items.filter(t=>t.publishPermission);
  return {
    meta:{
      company:"PAP WELD CORE AUTOMATION PRIVATE LIMITED",
      cin:"U25910TN2025PTC180645",
      gstin:"33AAPCP7917D1Z9",
      website:"papweld.com",
      generatedAt:new Date().toISOString(),
      totalTestimonials:items.length,
      avgRating:items.length?Math.round((items.reduce((s,t)=>s+t.rating,0)/items.length)*10)/10:0
    },
    testimonials:items.map(t=>clean(t,inline))
  };
}

async function ghSave(manual){
  if(!cloud()){
    saveLocal();
    if(manual)toast('Saved on this device ✓','ok');
    return;
  }
  if(saving)return;
  saving=true;pill();clearTimeout(tC);
  try{
    const published=S.testimonials.filter(t=>t.publishPermission);
    for(const t of published){
      await upload(t.photo,`testimonials/${t.id}-photo.jpg`);
    }
    const b64=b64enc(JSON.stringify(payload(false,true),null,2));
    const ex=await ghGet(cfg.dataPath).catch(()=>null);
    await ghPut(cfg.dataPath,b64,ex&&ex.sha);
    saveLocal();
    dirty=false;lastSave=new Date();saving=false;
    pill();
    if(manual){
      const hidden=S.testimonials.length-published.length;
      toast(hidden?`Saved ${published.length} to GitHub · ${hidden} local-only`:'Saved to GitHub ✓','ok');
    }
  }catch(e){
    console.warn(e);
    saving=false;dirty=true;
    pill('err','Save failed');
    toast(e.message.slice(0,70),'er');
  }
}
async function ghLoad(){
  if(!cloud())return toast('Cloud sync is not set up yet','er');
  if(dirty&&!confirm('Unsaved changes will be replaced. Continue?'))return;
  try{
    const f=await ghGet(cfg.dataPath);
    if(!f)return toast('No testimonials.json in repo yet','er');
    const raw=JSON.parse(b64dec(f.content));
    const cloudItems=(raw.testimonials||[]).map(r=>hyd({
      ...r,
      photo:r.photo?{...r.photo,dataUrl:null}:null
    }));
    const localOnly=S.testimonials.filter(t=>!t.publishPermission);
    const cloudIds=new Set(cloudItems.map(t=>t.id));
    const kept=localOnly.filter(t=>!cloudIds.has(t.id));
    S.testimonials=[...cloudItems,...kept];
    saveLocal();
    dirty=false;lastSave=new Date();activeId=null;
    render();
    toast(kept.length?`Loaded ✓ · kept ${kept.length} local-only`:'Loaded ✓','ok');
  }catch(e){
    toast('Load failed: '+e.message.slice(0,60),'er');
  }
}

/* =========================================================
   WEBHOOK (for remote customer submissions)
========================================================= */
async function postWebhook(t){
  if(!cfg.webhook)return false;
  try{
    /* Build a compact payload. The photo is compressed to ~600px JPEG
       so most endpoints (Formspree, GAS, Zapier) accept it. */
    const body={
      _subject:`New review from ${t.customerName||'a customer'}`,
      _source:'papweldcore-reviews',
      customerName:t.customerName,
      companyName:t.companyName,
      designation:t.designation,
      location:t.location,
      machines:t.machines,
      heardFrom:t.heardFrom,
      rating:t.rating,
      reviewTitle:t.reviewTitle,
      reviewText:t.reviewText,
      publishPermission:t.publishPermission,
      reviewDate:t.reviewDate,
      createdAt:t.createdAt,
      id:t.id
    };
    if(t.photo&&t.photo.dataUrl){
      try{
        const small=await compressTo(t.photo.dataUrl,MAX_PHOTO_WEBHOOK,PHOTO_QUALITY_WEBHOOK);
        body.photoBase64=small.split(',')[1];
        body.photoMime='image/jpeg';
        body.photoFilename=(t.photo.filename||'photo.jpg').replace(/\.\w+$/,'')+'.jpg';
      }catch(e){console.warn('photo compress for webhook failed',e)}
    }
    const r=await fetch(cfg.webhook,{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(body)
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    return true;
  }catch(e){
    console.warn('Webhook failed:',e);
    return false;
  }
}

/* ---------- shared image compressor ---------- */
function loadImageFromDataUrl(dataUrl){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>res(im);
    im.onerror=rej;
    im.src=dataUrl;
  });
}
function loadImageFromFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>loadImageFromDataUrl(r.result).then(res,rej);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
async function compressImage(img,maxDim,quality){
  const s=Math.min(1,maxDim/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*s));
  const h=Math.max(1,Math.round(img.height*s));
  const c=document.createElement('canvas');
  c.width=w;c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  return {dataUrl:c.toDataURL('image/jpeg',quality),width:w,height:h};
}
async function compressTo(dataUrl,maxDim,quality){
  const im=await loadImageFromDataUrl(dataUrl);
  const r=await compressImage(im,maxDim,quality);
  return r.dataUrl;
}
async function compressFile(file,maxDim,quality){
  const im=await loadImageFromFile(file);
  const r=await compressImage(im,maxDim,quality);
  return {filename:file.name.replace(/\.\w+$/,'')+'.jpg',dataUrl:r.dataUrl,width:r.width,height:r.height,size:file.size,origName:file.name};
}

function bindCustomer(){
  const form=document.getElementById('custForm');
  if(!form)return;

  /* ---------- stars ---------- */
  const starsEl=document.getElementById('custStars');
  let currentRating=0;
  if(starsEl){
    const paint=v=>{
      starsEl.querySelectorAll('span').forEach(s=>{
        const on=+s.dataset.v<=v;
        s.classList.toggle('on',on);
        s.setAttribute('aria-checked',+s.dataset.v===v?'true':'false');
      });
      const lbl=document.getElementById('custRatingLabel');
      lbl.textContent=v?v+' — '+RATING_LABELS[v]:'Tap a star to rate';
    };
    starsEl.addEventListener('click',e=>{
      const s=e.target.closest('span');if(!s)return;
      currentRating=+s.dataset.v;
      starsEl.dataset.rating=currentRating;
      paint(currentRating);
    });
    starsEl.addEventListener('keydown',e=>{
      const c=currentRating||0;let v=c;
      if(e.key==='ArrowRight'||e.key==='ArrowUp')v=Math.min(5,c+1);
      else if(e.key==='ArrowLeft'||e.key==='ArrowDown')v=Math.max(1,c-1);
      else if(e.key>='1'&&e.key<='5')v=+e.key;
      else if(e.key===' '||e.key==='Enter'){const t=e.target.closest('span');if(t)v=+t.dataset.v;}
      else return;
      e.preventDefault();
      currentRating=v;starsEl.dataset.rating=v;paint(v);
      starsEl.querySelector(`[data-v="${v}"]`)?.focus();
    });
    paint(0);
  }

  /* ---------- character counters ---------- */
  const tIn=form.querySelector('[name=reviewTitle]');
  const xIn=form.querySelector('[name=reviewText]');
  const tCount=document.getElementById('cTitleCount');
  const xCount=document.getElementById('cTextCount');
  if(tIn&&tCount)tIn.addEventListener('input',()=>{
    tCount.textContent=tIn.value.length+' / '+MAX_TITLE;
    tCount.className='cc'+(tIn.value.length>MAX_TITLE?' x':'');
  });
  if(xIn&&xCount)xIn.addEventListener('input',()=>{
    xCount.textContent=xIn.value.length+' / '+MAX_REVIEW;
    xCount.className='cc'+(xIn.value.length>MAX_REVIEW?' x':'');
  });

  /* ---------- permission toggle ---------- */
  const perm=document.getElementById('permToggle');
  if(perm){
    const cb=perm.querySelector('input[type=checkbox]');
    cb.addEventListener('change',()=>perm.classList.toggle('on',cb.checked));
  }

  /* ---------- photo upload: click / drag / paste ---------- */
  let custPhoto=null;   /* {filename,dataUrl,width,height,size} */
  const photoBox=document.getElementById('photoBox');
  const photoInput=document.getElementById('photoInput');
  const photoDrop=document.getElementById('photoDrop');
  const photoPreview=document.getElementById('photoPreview');

  function paintPhoto(){
    if(!custPhoto){
      photoBox.classList.remove('has-photo');
      photoDrop.style.display='';
      photoPreview.style.display='none';
      photoPreview.innerHTML='';
      return;
    }
    photoBox.classList.add('has-photo');
    photoDrop.style.display='none';
    photoPreview.style.display='';
    const kb=Math.round((custPhoto.dataUrl.length*0.75)/1024);
    photoPreview.innerHTML=`
      <div class="photo-thumb"><img src="${esc(custPhoto.dataUrl)}" alt=""></div>
      <div class="photo-info">
        <b>${esc(custPhoto.origName||custPhoto.filename||'photo.jpg')}</b>
        <small class="ok">✓ Ready — ${custPhoto.width}×${custPhoto.height}px · ~${kb} KB</small>
      </div>
      <div class="photo-actions">
        <button type="button" id="photoReplace">↻ Replace</button>
        <button type="button" id="photoRemove" class="rm">✕ Remove</button>
      </div>
    `;
    document.getElementById('photoReplace').addEventListener('click',()=>photoInput.click());
    document.getElementById('photoRemove').addEventListener('click',()=>{
      custPhoto=null;paintPhoto();
      toast('Photo removed');
    });
  }
  paintPhoto();

  async function handleFile(file){
    if(!file)return;
    if(!/^image\//i.test(file.type)){
      toast('Please choose an image file','er');return;
    }
    if(file.size>5*1024*1024){
      toast('Image too large — max 5 MB','er');return;
    }
    toast('Compressing photo…');
    try{
      custPhoto=await compressFile(file,MAX_PHOTO_LOCAL,PHOTO_QUALITY_LOCAL);
      paintPhoto();
      toast('Photo added ✓','ok');
    }catch(e){
      console.warn(e);
      toast('Could not read image','er');
    }
  }

  photoInput?.addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0];
    if(f)handleFile(f);
    e.target.value=''; /* allow picking the same file again */
  });

  /* drag & drop — bind to the whole box, not just the inner label */
  ['dragenter','dragover'].forEach(ev=>
    photoBox?.addEventListener(ev,e=>{
      e.preventDefault();e.stopPropagation();
      photoBox.classList.add('dr');
    })
  );
  ['dragleave','drop'].forEach(ev=>
    photoBox?.addEventListener(ev,e=>{
      e.preventDefault();e.stopPropagation();
      if(ev==='dragleave'&&photoBox.contains(e.relatedTarget))return;
      photoBox.classList.remove('dr');
    })
  );
  photoBox?.addEventListener('drop',e=>{
    const dt=e.dataTransfer;
    if(!dt)return;
    const f=dt.files&&dt.files[0];
    if(f){handleFile(f);return;}
    /* fallback: item list */
    const it=dt.items&&dt.items[0];
    if(it&&it.kind==='file'){const g=it.getAsFile();if(g)handleFile(g);}
  });

  /* paste — Ctrl/Cmd + V anywhere on the page while form is active */
  function onPaste(e){
    if(customerStage!=='form')return;
    const items=(e.clipboardData&&e.clipboardData.items)||[];
    for(const it of items){
      if(it.kind==='file'&&/^image\//i.test(it.type)){
        const f=it.getAsFile();
        if(f){handleFile(f);e.preventDefault();return;}
      }
    }
  }
  document.addEventListener('paste',onPaste);

  /* ---------- privacy link fallback ---------- */
  const pLink=document.getElementById('privacyLink');
  if(pLink&&!cfg.privacyUrl){
    pLink.addEventListener('click',e=>{
      e.preventDefault();
      alert('Privacy: your name, company, review and any uploaded photo are used only to process and (if permitted) display this testimonial. Request removal at any time by contacting PAP Weld Core.');
    });
  }

  /* ---------- submit ---------- */
  form.addEventListener('submit',async e=>{
    e.preventDefault();

    const hp=form.querySelector('[name=website]');
    if(hp&&hp.value){customerStage='thanks';lastSubmitted=null;render();return;}

    if(Date.now()-pageLoadTs<MIN_FILL_MS){
      customerStage='thanks';lastSubmitted=null;render();return;
    }
    if(!currentRating){
      toast('Please pick a star rating','er');
      starsEl.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    const consent=form.querySelector('[name=consent]');
    if(consent&&!consent.checked){
      toast('Please tick the consent box','er');
      consent.focus();return;
    }

    const fd=new FormData(form);
    const t=mk({
      customerName:(fd.get('customerName')||'').trim(),
      companyName:(fd.get('companyName')||'').trim(),
      designation:(fd.get('designation')||'').trim(),
      location:(fd.get('location')||'').trim(),
      machines:(fd.get('machines')||'').trim(),
      heardFrom:(fd.get('heardFrom')||'').trim(),
      reviewTitle:(fd.get('reviewTitle')||'').trim(),
      reviewText:(fd.get('reviewText')||'').trim(),
      rating:currentRating,
      publishPermission:!!fd.get('publishPermission'),
      source:'customer',
      seenByAdmin:false
    });
    t.verified=false;
    t.featured=false;
    if(custPhoto)t.photo={filename:custPhoto.filename,dataUrl:custPhoto.dataUrl};

    const btn=document.getElementById('custSubmit');
    btn.disabled=true;
    btn.textContent='Submitting…';

    S.testimonials.unshift(t);
    saveLocal();

    /* 1. Deliver to webhook (works for every customer) */
    if(cfg.webhook){
      postWebhook(t).catch(err=>console.warn('webhook',err));
    }
    /* 2. Push to GitHub if this browser happens to hold an admin token */
    if(cloud()){
      try{await ghSave(false);}catch(err){console.warn('Silent sync failed:',err);}
    }

    lastSubmitted=t;
    customerStage='thanks';
    render();
  });
}

async function loadPublicReviews(){
  const el=document.getElementById('pubReviews');
  if(!el)return;
  if(isLoggedIn&&S.testimonials.length){
    renderPublicReviews(S.testimonials,el);
    return;
  }
  try{
    const url=RAW(cfg.dataPath);
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    const items=(data.testimonials||[]).filter(t=>t.publishPermission);
    renderPublicReviews(items,el);
  }catch(e){
    el.innerHTML='';
  }
}

function renderPublicReviews(items,el){
  const sorted=[...items].sort((a,b)=>{
    if(a.featured!==b.featured)return a.featured?-1:1;
    return String(b.reviewDate||'').localeCompare(String(a.reviewDate||''));
  });
  if(!sorted.length){
    el.innerHTML=`
      <h2>⭐ What our customers say</h2>
      <p class="pub-summary">Be the first to share your experience with PAP Weld Core.</p>
    `;
    return;
  }
  const avg=Math.round((sorted.reduce((s,t)=>s+t.rating,0)/sorted.length)*10)/10;
  el.innerHTML=`
    <h2>⭐ What our customers say</h2>
    <p class="pub-summary">${avg.toFixed(1)} average from ${sorted.length} review${sorted.length>1?'s':''}</p>
    ${sorted.map(publicCard).join('')}
  `;
  injectJsonLd(sorted,avg);
}

function publicCard(t){
  const photo=src(t.photo);
  const initial=(t.customerName||'?').trim()[0].toUpperCase();
  const badges=[];
  if(t.verified)badges.push('<span class="tc-badge badge-verified">✓ Verified</span>');
  if(t.featured)badges.push('<span class="tc-badge badge-featured">★ Featured</span>');
  const meta=[t.designation,t.companyName,t.location].filter(Boolean).map(esc).join(' · ');
  return `
    <div class="pub-card">
      <div class="pub-head">
        <div class="pub-av">${photo?`<img src="${esc(photo)}" alt="">`:initial}</div>
        <div class="pub-meta">
          <div class="pub-name">${esc(t.customerName||'Customer')}${badges.length?' '+badges.join(' '):''}</div>
          <div class="pub-co">${meta}</div>
        </div>
        <div class="pub-when">${esc(ago(t.reviewDate||t.createdAt))}</div>
      </div>
      <div class="pub-stars">${stars(t.rating)}</div>
      <div class="pub-title">${esc(t.reviewTitle||'')}</div>
      <div class="pub-text">${esc(t.reviewText||'')}</div>
    </div>
  `;
}

function injectJsonLd(items,avg){
  document.getElementById('jsonld')?.remove();
  const org={
    "@context":"https://schema.org",
    "@type":"Organization",
    "name":"PAP Weld Core Automation Private Limited",
    "url":location.origin+location.pathname,
    "aggregateRating":{
      "@type":"AggregateRating",
      "ratingValue":avg.toFixed(1),
      "reviewCount":items.length,
      "bestRating":5,
      "worstRating":1
    },
    "review":items.slice(0,20).map(t=>({
      "@type":"Review",
      "author":{"@type":"Person","name":t.customerName||'Customer'},
      "datePublished":t.reviewDate||t.createdAt,
      "reviewBody":t.reviewText||'',
      "name":t.reviewTitle||'',
      "reviewRating":{"@type":"Rating","ratingValue":t.rating,"bestRating":5,"worstRating":1}
    }))
  };
  const el=document.createElement('script');
  el.type='application/ld+json';
  el.id='jsonld';
  el.textContent=JSON.stringify(org);
  document.head.appendChild(el);
}

    ${!cfg.webhook?'<div class="alert">📮 <b>No webhook configured.</b> Customer submissions from other devices will NOT reach you. Add a Formspree / Google Sheets / Zapier URL in <b>Connection</b>.</div>':'<div class="alert ok">📮 Webhook configured — remote submissions and photos will be delivered.</div>'}
    ${localOnly.length?`<div class="alert">🔒 <b>${localOnly.length}</b> testimonial${localOnly.length>1?'s':''} without publish permission stay on this device only and are never uploaded to GitHub.</div>`:''}
    ${withPhotos?`<div class="alert ok">📷 ${withPhotos} testimonial${withPhotos>1?'s':''} with photos.</div>`:''}
    <div class="row" style="margin-bottom:18px">
      <button class="btn pri" data-act="new">＋ New Testimonial</button>
      <button class="btn dk" data-act="load">⬇ Load from GitHub</button>
      <button class="btn" data-act="dl">⬇ Download JSON (published)</button>
      <button class="btn" data-act="dlAll">⬇ Download all (backup)</button>
      <button class="btn" data-act="sample">📌 Load sample</button>
    </div>
    ${newOnes.length?`
      <div class="alert ok"><b>${newOnes.length}</b> new submission${newOnes.length>1?'s':''} from customers — review and approve.</div>
      <h3 class="mont" style="margin-bottom:12px">New submissions</h3>
      <div class="grid">${newOnes.slice(0,6).map(tCard).join('')}</div>
    `:all.length?`
      <h3 class="mont" style="margin-bottom:12px">Recent testimonials</h3>
      <div class="grid">${all.slice(0,6).map(tCard).join('')}</div>
    `:`
      <div class="empty">
        <div>⭐</div>
        <h3>No testimonials yet</h3>
        <p style="margin-bottom:16px">Add your first review or load the sample to see how it works.</p>
        <button class="btn pri" data-act="new">＋ Add First Testimonial</button>
        <button class="btn" style="margin-left:8px" data-act="sample">📌 Load sample</button>
      </div>
    `}
  `;
}

function sortList(list){
  const arr=[...list];
  switch(sortBy){
    case 'oldest':arr.sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));break;
    case 'rating-high':arr.sort((a,b)=>b.rating-a.rating);break;
    case 'rating-low':arr.sort((a,b)=>a.rating-b.rating);break;
    case 'featured':arr.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||String(b.createdAt).localeCompare(String(a.createdAt)));break;
    default:arr.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  }
  return arr;
}

function listView(){
  let list=S.testimonials;
  if(view==='published')list=list.filter(t=>t.publishPermission);
  if(view==='pending')list=list.filter(t=>!t.seenByAdmin);
  if(q){
    const ql=q.toLowerCase();
    list=list.filter(t=>
      t.customerName.toLowerCase().includes(ql)||
      t.companyName.toLowerCase().includes(ql)||
      t.reviewTitle.toLowerCase().includes(ql)||
      t.reviewText.toLowerCase().includes(ql)
    );
  }
  list=sortList(list);
  const headerText={
    all:'All customer testimonials',
    published:'Only testimonials with publish permission',
    pending:'Customer submissions awaiting review'
  }[view]||'';
  const emptyIcon=view==='pending'?'⚠️':view==='published'?'✓':'⭐';
  const emptyText=view==='pending'?'No pending submissions':view==='published'?'Nothing published yet':'No testimonials yet';
  return `
    <div class="row" style="justify-content:space-between;margin-bottom:18px">
      <p style="color:var(--mu);flex:1;min-width:140px">${headerText}</p>
      <select class="sort-sel" id="sortSel" aria-label="Sort testimonials">
        <option value="newest" ${sortBy==='newest'?'selected':''}>Newest first</option>
        <option value="oldest" ${sortBy==='oldest'?'selected':''}>Oldest first</option>
        <option value="rating-high" ${sortBy==='rating-high'?'selected':''}>Highest rating</option>
        <option value="rating-low" ${sortBy==='rating-low'?'selected':''}>Lowest rating</option>
        <option value="featured" ${sortBy==='featured'?'selected':''}>Featured first</option>
      </select>
      <button class="btn pri" data-act="new">＋ Add</button>
    </div>
    ${list.length?`<div class="grid">${list.map(tCard).join('')}</div>`
    :`<div class="empty"><div>${emptyIcon}</div><h3>${emptyText}</h3></div>`}
  `;
}

function tCard(t){
  const photo=src(t.photo);
  const initial=(t.customerName||'?').trim()[0].toUpperCase();
  const statuses=[];
  if(t.source==='customer'&&!t.seenByAdmin)statuses.push('<span class="tc-badge badge-new">🆕 New</span>');
  if(t.verified)statuses.push('<span class="tc-badge badge-verified">✓ Verified</span>');
  if(t.featured)statuses.push('<span class="tc-badge badge-featured">★ Featured</span>');
  if(!t.publishPermission)statuses.push('<span class="tc-badge badge-pending">🔒 Local only</span>');
  return `
    <div class="card tc" data-open="${t.id}">
      <div class="tc-h">
        <div class="tc-av">${photo?`<img src="${esc(photo)}" alt="">`:initial}</div>
        <div class="tc-meta">
          <div class="tc-name">${esc(t.customerName||'Unnamed customer')}</div>
          <div class="tc-co">${esc(t.companyName||'No company')}${t.location?' · '+esc(t.location):''}</div>
          <div class="tc-stars">${stars(t.rating)}</div>
        </div>
      </div>
      ${statuses.length?`<div class="tc-status">${statuses.join('')}</div>`:''}
      <div class="tc-body">
        <div class="tc-title">${esc(t.reviewTitle||'Untitled review')}</div>
        <div class="tc-text">${esc(t.reviewText||'No review text yet')}</div>
        <div class="tc-when">${esc(ago(t.createdAt))}${t.heardFrom?' · '+esc(t.heardFrom):''}</div>
      </div>
    </div>
  `;
}

/* =========================================================
   ADMIN EVENTS
========================================================= */
document.addEventListener('click',async e=>{
  if(!isLoggedIn||!isAdminMode())return;
  const t=e.target;
  const c=s=>t.closest(s);
  if(c('.nv')&&c('.nv').dataset.v)return setView(c('.nv').dataset.v);
  if(c('#bg')){$('#side').classList.toggle('open');$('#ov').classList.toggle('show');return}
  if(c('#ov')){$('#side').classList.remove('open');$('#ov').classList.remove('show');return}
  if(c('#saveNow'))return ghSave(true);
  if(c('[data-open]')){
    activeId=c('[data-open]').dataset.open;
    const item=cur();
    if(item&&!item.seenByAdmin){item.seenByAdmin=true;touch();}
    renderAdminView();scrollTo(0,0);return;
  }
  if(c('#stars span')){
    const v=+c('#stars span').dataset.v;
    const item=cur();if(!item)return;
    item.rating=v;
    $('#ratingLabel').textContent=v+' — '+RATING_LABELS[v];
    $$('#stars span').forEach(s=>s.classList.toggle('on',+s.dataset.v<=v));
    touch();return;
  }
  if(c('[data-rm]')){
    const k=c('[data-rm]').dataset.rm;
    const item=cur();if(!item)return;
    item[k]=null;touch();renderAdminView();return;
  }
  const a=c('[data-act]')?.dataset.act;
  if(!a)return;
  const item=cur();
  if(a==='back'){activeId=null;renderAdminView()}
  else if(a==='new'){
    const fresh=mk({source:'admin',seenByAdmin:true});
    S.testimonials.unshift(fresh);
    activeId=fresh.id;
    touch();renderAdminView();
    setTimeout(()=>$('[data-f=customerName]')?.focus(),80);
  }
  else if(a==='save'){ghSave(true)}
  else if(a==='del'&&item){
    if(!confirm('Delete this testimonial from '+item.customerName+'? Cannot be undone.'))return;
    S.testimonials.splice(S.testimonials.indexOf(item),1);
    activeId=null;touch();renderAdminView();toast('Deleted');
  }
  else if(a==='load'){ghLoad()}
  else if(a==='dl'){downloadJSON(true)}
  else if(a==='dlAll'){downloadJSON(false)}
  else if(a==='sample'){
    if(S.testimonials.some(t=>t.isSample))return toast('Sample already loaded');
    const s=mk({...SAMPLE,source:'admin',seenByAdmin:true});
    S.testimonials.unshift(s);
    activeId=s.id;
    touch();renderAdminView();
    toast('Sample loaded','ok');
  }
  else if(a==='cfg'||a==='test'){
    ['owner','repo','branch','dataPath','token','webhook','privacyUrl'].forEach(k=>{
      const el=$('#c_'+k);
      if(el)cfg[k]=el.value.trim();
    });
    localStorage.setItem(CK,JSON.stringify(cfg));
    pill();
    if(a==='cfg')toast('Settings saved','ok');
    else{
      try{
        const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`,{headers:H()});
        const j=await r.json();
        toast(r.ok?(j.permissions&&j.permissions.push?'Connected ✓ write access':'Connected, read-only'):'Failed: '+(j.message||r.status),r.ok&&j.permissions?.push?'ok':'er');
      }catch(_){toast('Network error','er')}
    }
  }
  else if(a==='clearLocal'){
    if(!confirm('Clear all testimonials from this browser? GitHub copy is not affected.'))return;
    if(!confirm('Are you 100% sure?'))return;
    localStorage.removeItem(DB);
    S={testimonials:[]};
    activeId=null;renderAdminView();
    toast('Local data cleared');
  }
});

document.addEventListener('input',e=>{
  if(!isLoggedIn||!isAdminMode())return;
  const t=e.target;
  if(t.id==='q'){
    q=t.value;
    if(!activeId&&view!=='dash'&&view!=='settings')$('#pg').innerHTML=listView();
    return;
  }
  const item=cur();if(!item)return;
  if(t.dataset.f){
    const k=t.dataset.f;
    item[k]=t.value;
    if(k==='reviewTitle'){
      const el=$('#tc-title');
      if(el){el.textContent=t.value.length+' / '+MAX_TITLE;el.className='cc'+(t.value.length>MAX_TITLE?' x':'')}
    }
    if(k==='reviewText'){
      const el=$('#tc-text');
      if(el){el.textContent=t.value.length+' / '+MAX_REVIEW;el.className='cc'+(t.value.length>MAX_REVIEW?' x':'')}
    }
    if(k==='customerName'){const h=$('.edtop h2');if(h)h.textContent=t.value||'New testimonial'}
    touch();
  }
});

document.addEventListener('change',async e=>{
  if(!isLoggedIn||!isAdminMode())return;

  if(e.target.id==='sortSel'){
    sortBy=e.target.value;
    renderAdminView();
    return;
  }

  const up=e.target.dataset.up;
  if(up){
    const item=cur();if(!item)return;
    const fs=[...e.target.files];if(!fs.length)return;
    toast('Processing…');
    try{
      item[up]=await compressFile(fs[0],MAX_PHOTO_LOCAL,PHOTO_QUALITY_LOCAL);
      touch();renderAdminView();
      toast('Photo added','ok');
    }catch(err){
      console.warn(err);
      toast('Could not read image','er');
    }
    return;
  }

  const tg=e.target.closest?.('.tg-item');
  if(tg&&tg.dataset.tog&&e.target.type==='checkbox'){
    const item=cur();if(!item)return;
    item[tg.dataset.tog]=e.target.checked;
    tg.classList.toggle('on',e.target.checked);
    touch();
  }
});

function downloadJSON(publishedOnly){
  const data=payload(true,publishedOnly);
  const filename=publishedOnly?'testimonials.json':'testimonials-backup.json';
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const l=document.createElement('a');
  l.href=URL.createObjectURL(b);
  l.download=filename;
  l.click();
  setTimeout(()=>URL.revokeObjectURL(l.href),2000);
  toast('Downloaded '+filename,'ok');
}

document.addEventListener('keydown',e=>{
  if(!isLoggedIn||!isAdminMode())return;
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();ghSave(true)}
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();const q=$('#q');if(q){q.focus();q.select()}}
  if(e.key==='Escape'&&activeId){activeId=null;renderAdminView()}
});

addEventListener('beforeunload',e=>{
  saveLocal();
  if(dirty&&cloud()&&isAdminMode()){e.preventDefault();e.returnValue=''}
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&isAdminMode()){
    saveLocal();
    if(dirty&&cloud())ghSave(false);
  }
});

/* =========================================================
   BOOT
========================================================= */
loadLocal();
render();
</script>
